name: Daily Analytics Snapshot & Report

on:
  schedule:
    - cron: "0 10 * * *" # taeglich 10:00 UTC (~12:00 MESZ) - mittags, wenn
      # aktiv getestet wird, statt morgens vor Arbeitsbeginn
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium

      - name: Material-Heatmap-Screenshot erzeugen
        continue-on-error: true
        # Ersetzt manuelles Clarity-Heatmap-Screenshotten fuer die
        # Material-Auswahl im Shop (siehe reporting/README.md): navigiert per
        # echtem Headless-Chromium zur Produktseite und markiert das laut
        # Mixpanel meistgewaehlte Material direkt im DOM. continue-on-error,
        # da kein Blocker fuer den Rest des Laufs (z.B. noch keine
        # material_select-Events vorhanden -> Skript beendet sich einfach
        # ohne Bild, siehe eigene Log-Ausgabe).
        env:
          MIXPANEL_PROJECT_ID: ${{ secrets.MIXPANEL_PROJECT_ID }}
          MIXPANEL_SERVICE_ACCOUNT_USERNAME: ${{ secrets.MIXPANEL_SERVICE_ACCOUNT_USERNAME }}
          MIXPANEL_SERVICE_ACCOUNT_SECRET: ${{ secrets.MIXPANEL_SERVICE_ACCOUNT_SECRET }}
          MIXPANEL_REGION: ${{ secrets.MIXPANEL_REGION }}
        run: node reporting/material-heatmap-screenshot.mjs

      - name: Snapshot von Clarity abrufen
        id: clarity_snapshot
        continue-on-error: true
        # Clarity erlaubt nur 10 API-Anfragen/Tag - bei haeufigem manuellen
        # Testen (z.B. mehrere Workflow-Laeufe am selben Tag) kann das
        # Kontingent ausgeschoepft sein. continue-on-error verhindert, dass
        # dieser eine, ratenlimitierte Schritt die unten folgende
        # GA4-/Mixpanel-Aktualisierung mit blockiert (live beobachtet: ohne
        # dies wurden bei einem Clarity-Fehler automatisch ALLE weiteren
        # Schritte uebersprungen, obwohl sie unabhaengig funktioniert
        # haetten).
        env:
          CLARITY_API_TOKEN: ${{ secrets.CLARITY_API_TOKEN }}
        run: node reporting/clarity-snapshot.mjs

      - name: Oeffentlichen Ergebnis-Report erzeugen
        if: always()
        # Erzeugt /ergebnisse.html neu, mit dem aktuellen Clarity-Archiv
        # UND live abgefragten GA4-/Mixpanel-Daten (siehe
        # reporting/README.md). Die Bestellbestaetigung (OrderForm.tsx)
        # verlinkt hierher - so sehen Tester nach ihrer Testbestellung die
        # bisherigen Auswertungen. Degradiert sauber (kein Absturz), falls
        # einzelne Secrets fehlen oder der Clarity-Schritt oben
        # fehlgeschlagen ist (nutzt dann einfach den letzten vorhandenen
        # Clarity-Snapshot weiter).
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          MIXPANEL_PROJECT_ID: ${{ secrets.MIXPANEL_PROJECT_ID }}
          MIXPANEL_SERVICE_ACCOUNT_USERNAME: ${{ secrets.MIXPANEL_SERVICE_ACCOUNT_USERNAME }}
          MIXPANEL_SERVICE_ACCOUNT_SECRET: ${{ secrets.MIXPANEL_SERVICE_ACCOUNT_SECRET }}
          MIXPANEL_REGION: ${{ secrets.MIXPANEL_REGION }}
        run: node reporting/generate-report.mjs --out public/ergebnisse.html

      - name: Snapshot + Report committen
        if: always()
        run: |
          git config user.name "clarity-snapshot-bot"
          git config user.email "actions@github.com"
          git add reporting/data reporting/screenshots public/ergebnisse.html

          if git diff --cached --quiet; then
            echo "Keine Aenderungen, nichts zu committen."
            exit 0
          fi

          git commit -m "Analytics-Snapshot + Ergebnis-Report $(date -u +%Y-%m-%d)"

          # Falls zwischen Checkout und Push jemand anderes (z.B. ein
          # App-Deploy oder ein zweiter Lauf) main aktualisiert hat, schlaegt
          # ein einfacher "git push" mit "rejected (fetch first)" fehl -
          # live beobachtet. Rebase + ein paar Versuche fangen das ab, statt
          # den taeglichen Snapshot bei jedem Konflikt verstummen zu lassen.
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "Push fehlgeschlagen (Versuch $i/3), warte und versuche erneut..."
            sleep 10
          done
          echo "Push nach 3 Versuchen weiterhin fehlgeschlagen."
          exit 1
