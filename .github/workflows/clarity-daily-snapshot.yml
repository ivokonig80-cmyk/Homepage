name: Clarity Daily Snapshot

on:
  schedule:
    - cron: "0 5 * * *" # taeglich 05:00 UTC (~07:00 MESZ)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Snapshot von Clarity abrufen
        env:
          CLARITY_API_TOKEN: ${{ secrets.CLARITY_API_TOKEN }}
        run: node reporting/clarity-snapshot.mjs

      - name: Snapshot committen
        run: |
          git config user.name "clarity-snapshot-bot"
          git config user.email "actions@github.com"
          git add reporting/data
          git diff --cached --quiet || git commit -m "Clarity-Snapshot $(date -u +%Y-%m-%d)"
          git push
